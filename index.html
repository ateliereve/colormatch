  // Local-only project persistence. Binary files remain in IndexedDB, never leave the browser.

  const PROJECT_DB='tonal-project-local-v1';

  function storageIndicator(label,status='ok'){

  function openProjectDB(){

    projectDBPromise=new Promise((resolve,reject)=>{
      if(!('indexedDB' in window)){reject(new Error('이 브라우저에서는 로컬 파일 저장을 지원하지 않습니다.'));return;}
      const request=indexedDB.open(PROJECT_DB,1);
      request.onupgradeneeded=()=>{
        const db=request.result;
        if(!db.objectStoreNames.contains('project'))db.createObjectStore('project');
        if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos',{keyPath:'id'});
      };
      request.onsuccess=()=>{const db=request.result;db.onversionchange=()=>db.close();resolve(db);};
      request.onerror=()=>reject(request.error||new Error('사진 저장소를 열 수 없습니다.'));
      request.onblocked=()=>reject(new Error('다른 탭에서 데이터베이스가 사용 중입니다.'));
    });
    return projectDBPromise;
  }
  function projectMetadata(){
    return {version:1,photoIds:state.photos.map(p=>p.id),referenceId:state.referenceId,
      strength:state.strength,view:state.view,done:state.done,activeScreen,
      collage:{...collage},collageOrderIds:[...collageOrderIds],
      compare:state.photos.map(p=>[p.id,p.compare??50])};
  }
  function persistProject(includePhotos=false){
    if(!projectReady || storageFailed)return Promise.resolve();
    if(metaTimer){clearTimeout(metaTimer);metaTimer=null;}
    const meta=projectMetadata();
    const storedPhotos=includePhotos?state.photos.map(p=>({
      id:p.id,name:p.file.name,type:p.file.type,lastModified:p.file.lastModified,
      original:p.file,edited:state.done?p.blob:null
    })):null;
    storageIndicator('저장 중…');
    saveQueue=saveQueue.catch(()=>{}).then(async()=>{
      const db=await openProjectDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(includePhotos?['project','photos']:['project'],'readwrite');
        tx.oncomplete=resolve;
        tx.onerror=()=>reject(tx.error||new Error('브라우저 저장 공간이 부족할 수 있습니다.'));
        tx.onabort=()=>reject(tx.error||new Error('저장 작업이 취소되었습니다.'));
        tx.objectStore('project').put(meta,'session');
        if(includePhotos){
          const ps=tx.objectStore('photos');
          ps.clear();
          for(const photo of storedPhotos)ps.put(photo);
        }
      });
    }).then(()=>{storageIndicator('저장됨');}).catch(error=>{
      storageIndicator('저장 실패','error');
      flash(`자동 저장에 실패했습니다. ${error?.name==='QuotaExceededError'?'브라우저 저장 공간이 부족합니다.':error?.message||'브라우저 저장소를 확인해주세요.'}`,true);
    });

  }
  function scheduleProjectMeta(){

  // Startup hydration creates fresh object URLs so saved files work after a reload.
  async function restoreProject(){
    try{
      storageIndicator('불러오는 중…');
      const db=await openProjectDB();
      const {meta,records}=await new Promise((resolve,reject)=>{
        const tx=db.transaction(['project','photos'],'readonly');
        const a=tx.objectStore('project').get('session');
        const b=tx.objectStore('photos').getAll();
        tx.oncomplete=()=>resolve({meta:a.result||null,records:b.result||[]});
        tx.onerror=()=>reject(tx.error||new Error('저장된 작업을 읽지 못했습니다.'));
      });
      if(meta && Array.isArray(meta.photoIds)){
        const indexed=new Map(records.map(r=>[r.id,r]));
        const parsed=[];
        for(const id of meta.photoIds.slice(0,MAX_FILES)){
          const record=indexed.get(id);
          if(!record || !(record.original instanceof Blob))continue;
          const file=new File([record.original],record.name||'photo.png',{
            type:record.type||record.original.type||'image/png',lastModified:record.lastModified||Date.now()});
          const edited=record.edited instanceof Blob && record.edited.size>0?record.edited:null;
          parsed.push({id,file,url:URL.createObjectURL(file),blob:edited,
            resultUrl:edited?URL.createObjectURL(edited):null,
            profile:null,compare:50,collageThumb:null,collageSource:null,collageSize:null});
        }
        const compare=new Map(Array.isArray(meta.compare)?meta.compare:[]);
        parsed.forEach(p=>p.compare=clamp(Number(compare.get(p.id)??50),0,100));
        state.photos=parsed;
        idSequence=Math.max(0,...parsed.map(p=>p.id));
        state.referenceId=parsed.some(p=>p.id===meta.referenceId)?meta.referenceId:(parsed[0]?.id??null);
        state.done=Boolean(meta.done && parsed.length && parsed.every(p=>Boolean(p.resultUrl)));
        if(!state.done){
          for(const photo of parsed){if(photo.resultUrl)URL.revokeObjectURL(photo.resultUrl);photo.resultUrl=null;photo.blob=null;}
        }
        state.view=meta.view==='before'?'before':'after';
        activeScreen=meta.activeScreen==='collage' && parsed.length?'collage':'color';
        if(meta.collage&&typeof meta.collage==='object'){
          for(const key of Object.keys(DEFAULT_COLLAGE)){
            const value=meta.collage[key];
            if(typeof DEFAULT_COLLAGE[key]===typeof value)collage[key]=value;
          }
        }
        const validIds=new Set(parsed.map(p=>p.id));
        collageOrderIds=Array.isArray(meta.collageOrderIds)?meta.collageOrderIds.filter(id=>validIds.has(id)):[];
        syncStrength(Number.isFinite(Number(meta.strength))?meta.strength:130);
        // Restore all visible control states without changing the saved photo objects.
        updateAllCollageControls();
        setPreviewView(state.view);
        drawCards();renderCollageOrder();
        if(activeScreen==='collage'){refreshCollage();queueCollageFit();}
        else queuePhotoFit();
      }
      storageIndicator('저장됨');
    }catch(error){
      storageFailed=true;
      storageIndicator('자동 저장 불가','error');
      flash(`브라우저에 자동 저장할 수 없습니다. ${error?.message||''}`,true);
    }finally{
      projectReady=true;
      $('pickBtn').disabled=false;
      $('fileInput').disabled=state.working||collageSaving||zipSaving;
    }
  }

  function fitPhotoGrid(){
    if(window.innerWidth<=720){
      const grid=$('imageGrid');
      grid.style.removeProperty('width');
      grid.style.removeProperty('--frame-width');
      grid.style.removeProperty('--frame-height');
      return;
    }
    if(activeScreen!=='color' || !state.photos.length)return;
    const g=$('imageGrid'),r=g.getBoundingClientRect();
    if(r.width<20 || r.height<20)return;
    const css=getComputedStyle(g);
    const cols=Math.max(1,Number(g.style.getPropertyValue('--photo-cols'))||1);
    const rows=Math.max(1,Number(g.style.getPropertyValue('--photo-rows'))||1);
    const mobile=window.innerWidth<=720;
    const fullWidth=mobile?$('results').getBoundingClientRect().width:r.width;
    const insetLeft=parseFloat(css.paddingLeft),insetRight=parseFloat(css.paddingRight);
    const gapX=parseFloat(css.columnGap);
    const horizontal=fullWidth-insetLeft-insetRight-(cols-1)*gapX;
    const vertical=r.height-parseFloat(css.paddingTop)-parseFloat(css.paddingBottom)-(rows-1)*parseFloat(css.rowGap);
    const cellW=horizontal/cols,cellH=vertical/rows;
    // Keep two photos near each other even when a short mobile viewport limits
    // their height. The grid's actual width then shrinks with the photo frames.
    const controlsHeight=mobile?25:32;
    const maxWidth=mobile?340:260;
    const frameWidth=Math.max(25,Math.floor(Math.min(cellW,Math.max(1,cellH-controlsHeight)*4/3,maxWidth)));
    const frameHeight=Math.max(19,Math.floor(frameWidth*3/4));
    g.style.setProperty('--frame-height',frameHeight+'px');
    g.style.setProperty('--frame-width',frameWidth+'px');
    if(mobile && cols>=2 && !document.body.classList.contains('sheet-open')){
      const fittedWidth=frameWidth*cols+(cols-1)*gapX+insetLeft+insetRight;
      g.style.width=Math.min(fullWidth,Math.ceil(fittedWidth))+'px';
    }else{
      g.style.removeProperty('width');
    }
  }

  async function uploadFiles(files) {
    if (state.working || collageSaving || zipSaving) return;
    clearPendingRemoval();
    const candidates = Array.from(files).filter(f => f.type.startsWith('image/') && /^(image\/(jpeg|png|webp|avif))$/.test(f.type));
    if (!candidates.length) { flash('지원되는 이미지(JPEG, PNG, WebP, AVIF)를 선택해주세요.', true); return; }
    const remaining = MAX_FILES - state.photos.length;
    if (remaining <= 0) { flash('최대 6장까지 추가할 수 있습니다.', true); return; }
    if (candidates.some(f => f.size > 60 * 1024 * 1024)) {
      flash('60MB를 초과하는 이미지가 있어 제외했습니다. 파일 크기를 줄여 다시 시도해주세요.', true);
    }
    const accepted = candidates.filter(f => f.size <= 60*1024*1024).slice(0, remaining);
    if (!accepted.length) return;
    invalidate();
    for (const file of accepted) {
      const item = { id:++idSequence, file, url:URL.createObjectURL(file), resultUrl:null, blob:null, profile:null, compare:50, collageThumb:null };
      state.photos.push(item);
      if (state.referenceId === null) state.referenceId = item.id;
    }
    drawCards();
    renderCollageOrder();
    if(activeScreen==='collage')refreshCollage();
    persistProject(true);
    if (candidates.length > remaining) flash(`6장 제한으로 ${remaining}장만 추가했습니다.`, true);
    else if (candidates.every(f => f.size <= 60*1024*1024)) clearFlash();
  }
  function removePhoto(id) {

    invalidate();

    persistProject(true);
  }
  function removeAll() {

  async function sourceDimensions(file, sourceUrl) {
    let pending=imageSizes.get(file);
    if(!pending) {
      pending=new Promise((resolve,reject)=>{
        const img=new Image();
        img.onload=()=>{
          const width=img.naturalWidth,height=img.naturalHeight;
          if(!width || !height) reject(new Error('사진 크기를 확인할 수 없습니다.'));
          else resolve({width,height});
        };
        img.onerror=()=>reject(new Error('이미지를 열 수 없습니다. 이미지 형식을 확인해주세요.'));
        img.src=sourceUrl;
      });
      imageSizes.set(file,pending);
    }
    try {return await pending;}
    catch(e){imageSizes.delete(file);throw e;}
  }
  // Downsample while decoding, not after allocating a full-size bitmap.
  // This protects Android memory during analysis, collage preview and export.
  async function decode(file, sourceUrl, limits={}) {
    const original=await sourceDimensions(file,sourceUrl);
    const originalPixels=original.width*original.height;
    if(originalPixels>110000000)throw new Error('110MP를 초과하는 이미지는 브라우저에서 처리할 수 없습니다.');
    let factor=1;
    if(limits.maxSide)factor=Math.min(factor,limits.maxSide/Math.max(original.width,original.height));
    if(limits.maxPixels)factor=Math.min(factor,Math.sqrt(limits.maxPixels/originalPixels));
    if(limits.desiredScale)factor=Math.min(factor,limits.desiredScale);
    factor=clamp(factor,.00001,1);
    const targetWidth=Math.max(1,Math.round(original.width*factor));
    const targetHeight=Math.max(1,Math.round(original.height*factor));
    const scaled=targetWidth<original.width || targetHeight<original.height;
    if(typeof createImageBitmap==='function') {
      try {
        const opts=scaled?{resizeWidth:targetWidth,resizeHeight:targetHeight,resizeQuality:'high'}:undefined;
        const bmp=await createImageBitmap(file,opts);
        if(scaled && (bmp.width>targetWidth*1.1+2 || bmp.height>targetHeight*1.1+2)) {
          bmp.close();throw new Error('이 브라우저에서 고해상도 이미지 축소 디코딩을 지원하지 않습니다.');
        }
        return {image:bmp,width:bmp.width,height:bmp.height,originalWidth:original.width,originalHeight:original.height,close:()=>bmp.close()};
      }catch(err){
        if(scaled && (handheld || originalPixels>20000000))throw new Error('사진을 안전한 크기로 불러오지 못했습니다. 원본 크기를 줄여 다시 시도해주세요.');
      }
    }
    const element=await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(new Error('이미지 디코딩에 실패했습니다. 지원하지 않는 형식일 수 있습니다.'));
      img.src=sourceUrl;
    });
    if(scaled){
      const canvas=document.createElement('canvas');canvas.width=targetWidth;canvas.height=targetHeight;
      const ctx=canvas.getContext('2d',{alpha:true,colorSpace:'srgb'});
      if(!ctx)throw new Error('사진 크기를 조정할 수 없습니다.');
      ctx.imageSmoothingQuality='high';ctx.drawImage(element,0,0,targetWidth,targetHeight);
      element.src='';
      return {image:canvas,width:targetWidth,height:targetHeight,originalWidth:original.width,originalHeight:original.height,close:()=>{canvas.width=0;canvas.height=0;}};
    }
    return {image:element,width:original.width,height:original.height,originalWidth:original.width,originalHeight:original.height,close:()=>{element.src='';}};
  }

          return;
        }catch(err){
          if(revision!==collageRevision || token!==state.jobToken)throw err;
          lastError=err;
        }finally{
          if(canvas){canvas.width=0;canvas.height=0;canvas=null;}
        }
      }
      throw lastError||new Error('PNG 파일을 생성하지 못했습니다.');
    }catch(err){flash(`콜라주 저장 오류: ${err.message} 화질을 낮춰 재시도해주세요.`,true);}
    finally{
      if(canvas){canvas.width=0;canvas.height=0;}
      collageSaving=false;button.disabled=false;button.textContent='콜라주 PNG 저장';
      updateControls();
    }
  }
  function updateSegment(container,button){
    container.querySelectorAll('button').forEach(el=>{
      const active=el===button;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));
    });
  }
  function bindCollageSegment(id,selector,field){
    $(id).addEventListener('click',e=>{
      const button=e.target.closest(selector);if(!button || state.working || collageSaving || zipSaving)return;
      const next=button.dataset[field];if(!next || collage[field]===next)return;
      collage[field]=next;updateSegment($(id),button);
      if(field==='orientation')updateCollageRatios();
      refreshCollage();
    });
  }
  bindCollageSegment('collageOrientation','button[data-orientation]','orientation');
  bindCollageSegment('collageLayouts','button[data-layout]','layout');
  bindCollageSegment('collageFit','button[data-fit]','fit');
  $('collageRatios').addEventListener('click',e=>{
    const button=e.target.closest('button[data-ratio]');
    if(!button || state.working || collageSaving || zipSaving)return;
    collage.ratio=button.dataset.ratio;updateCollageRatios();refreshCollage();persistProject(false);
  });
  for(const [name,label] of [['Gap','gap'],['Padding','padding']]){
    $('collage'+name).addEventListener('input',e=>{
      if(state.working || collageSaving || zipSaving)return;
      collage[label]=Number(e.target.value);
      $('collage'+name+'Value').textContent=collage[label]+'px';
      refreshCollage();
    });
    $('collage'+name).addEventListener('change',()=>persistProject(false));
  }
  $('collageBackground').addEventListener('click',e=>{
    const button=e.target.closest('button[data-bg]');if(!button||state.working||collageSaving||zipSaving)return;
    collage.background=button.dataset.bg;
    $('collageBackground').querySelectorAll('button').forEach(el=>{
      const active=el===button;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));
    });
    refreshCollage();
  });
  $('collageResolution').addEventListener('change',e=>{
    if(state.working || collageSaving || zipSaving)return;
    collage.resolution=Number(e.target.value);
    refreshCollage();
    persistProject(false);
  });
  $('saveCollage').addEventListener('click',downloadCollage);
  $('resetCollageSettings').addEventListener('click',resetCollageSettings);
  $('resetCollageAll').addEventListener('click',()=>{
    if(state.working||collageSaving||zipSaving)return;
    if(!window.confirm('업로드한 모든 사진과 보정 결과, 콜라주 설정을 초기화할까요?'))return;
    removeAll();
    resetCollageSettings();
    closeTools();switchScreen('color');
    persistProject(true);
  });
  updateCollageRatios();
  updateCollageSize();

  $('pickBtn').addEventListener('click',e=>{e.stopPropagation();$('fileInput').click();});
  $('dropzone').addEventListener('click',()=>{if(!state.working && state.photos.length<MAX_FILES)$('fileInput').click();});
  $('dropzone').addEventListener('keydown',e=>{if(e.target!==$('dropzone'))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();$('dropzone').click();}});
  $('fileInput').addEventListener('change',async e=>{await uploadFiles(e.target.files);e.target.value='';});
  let dragLevel=0;
  document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();});
  document.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length && !e.target.closest('#dropzone'))e.preventDefault();});
  $('dropzone').addEventListener('dragenter',e=>{e.preventDefault();dragLevel++;$('dropzone').classList.add('dragging');});
  $('dropzone').addEventListener('dragover',e=>e.preventDefault());
  $('dropzone').addEventListener('dragleave',e=>{e.preventDefault();dragLevel=Math.max(0,dragLevel-1);if(!dragLevel)$('dropzone').classList.remove('dragging');});
  $('dropzone').addEventListener('drop',async e=>{e.preventDefault();dragLevel=0;$('dropzone').classList.remove('dragging');await uploadFiles(e.dataTransfer.files);});
  document.addEventListener('drop',async e=>{if(e.target.closest('#dropzone'))return;if(e.dataTransfer?.files?.length && state.photos.length<MAX_FILES)await uploadFiles(e.dataTransfer.files);});
  $('clearBtn').addEventListener('click',removeAll);
  $('processBtn').addEventListener('click',runCorrection);
  $('downloadAll').addEventListener('click',downloadAll);
  // Pointer-driven control: handles actual finger drag, mouse drag and keyboard.
  // Unlike a native input[type=range], no browser-generated input event can
  // overwrite the value from a touch gesture. The wide hit area avoids scrolling conflicts.
  const strengthControl=$('strength');
  let strengthPointer=null;
  let strengthGestureStart=state.strength;
  let committedStrength=state.strength;
  const strengthMin=0,strengthMax=250,strengthStep=5;
  function strengthDisabled(){return state.working || zipSaving || collageSaving;}
  function syncStrength(value){
    if(!Number.isFinite(Number(value)))return;
    const next=clamp(Math.round(Number(value)/strengthStep)*strengthStep,strengthMin,strengthMax);
    state.strength=next;
    $('strengthLabel').textContent=next+'%';
    strengthControl.style.setProperty('--strength-progress',100*(next-strengthMin)/(strengthMax-strengthMin)+'%');
    strengthControl.setAttribute('aria-valuenow',String(next));
    strengthControl.setAttribute('aria-valuetext',next+'%');
  }
  function positionToStrength(clientX){
    const box=strengthControl.getBoundingClientRect(),inset=13;
    const ratio=clamp((clientX-box.left-inset)/Math.max(1,box.width-inset*2),0,1);
    syncStrength(strengthMin+ratio*(strengthMax-strengthMin));
  }
  function finishStrengthGesture(){
    if(strengthPointer===null)return;
    strengthPointer=null;
    strengthControl.classList.remove('is-dragging');
    if(state.strength!==strengthGestureStart){
      committedStrength=state.strength;
      // Never discard the current results until the user's finger is released.
      if(state.done){invalidate();drawCards();}
      persistProject(false);
    }
  }
  if(window.PointerEvent){
    strengthControl.addEventListener('pointerdown',event=>{
      if(strengthDisabled() || (event.pointerType==='mouse'&&event.button!==0))return;
      event.preventDefault();
      strengthPointer=event.pointerId;
      strengthGestureStart=state.strength;
      strengthControl.classList.add('is-dragging');
      positionToStrength(event.clientX);
      try{strengthControl.setPointerCapture(event.pointerId);}catch(_){}
    });
    strengthControl.addEventListener('pointermove',event=>{
      if(strengthPointer!==event.pointerId)return;
      if(event.cancelable)event.preventDefault();
      positionToStrength(event.clientX);
    });
    strengthControl.addEventListener('pointerup',event=>{
      if(strengthPointer!==event.pointerId)return;
      positionToStrength(event.clientX);
      finishStrengthGesture();
      if(strengthControl.hasPointerCapture?.(event.pointerId)){
        try{strengthControl.releasePointerCapture(event.pointerId);}catch(_){}
      }
    });
    strengthControl.addEventListener('pointercancel',event=>{
      if(strengthPointer===event.pointerId)finishStrengthGesture();
    });
    strengthControl.addEventListener('lostpointercapture',event=>{
      if(strengthPointer===event.pointerId)finishStrengthGesture();
    });
  }else{
    // Fallback for older Android WebViews without Pointer Events.
    const touchPoint=event=>Array.from(event.changedTouches).find(t=>t.identifier===strengthPointer);
    strengthControl.addEventListener('touchstart',event=>{
      if(strengthDisabled() || strengthPointer!==null)return;
      const touch=event.changedTouches[0];if(!touch)return;
      if(event.cancelable)event.preventDefault();
      strengthPointer=touch.identifier;strengthGestureStart=state.strength;
      strengthControl.classList.add('is-dragging');positionToStrength(touch.clientX);
    },{passive:false});
    strengthControl.addEventListener('touchmove',event=>{
      const touch=touchPoint(event);if(!touch)return;
      if(event.cancelable)event.preventDefault();positionToStrength(touch.clientX);
    },{passive:false});
    for(const type of ['touchend','touchcancel']){
      strengthControl.addEventListener(type,event=>{
        const touch=touchPoint(event);if(!touch)return;
        if(type==='touchend')positionToStrength(touch.clientX);
        finishStrengthGesture();
      },{passive:false});
    }
    const finishMouse=()=>{if(strengthPointer==='mouse')finishStrengthGesture();};
    strengthControl.addEventListener('mousedown',event=>{
      if(strengthDisabled()||event.button!==0)return;
      strengthPointer='mouse';strengthGestureStart=state.strength;
      strengthControl.classList.add('is-dragging');positionToStrength(event.clientX);
    });
    document.addEventListener('mousemove',event=>{
      if(strengthPointer==='mouse')positionToStrength(event.clientX);
    });
    document.addEventListener('mouseup',finishMouse);
  }
  strengthControl.addEventListener('keydown',event=>{
    if(strengthDisabled())return;
    const previous=state.strength;
    if(event.key==='ArrowLeft'||event.key==='ArrowDown')syncStrength(previous-strengthStep);
    else if(event.key==='ArrowRight'||event.key==='ArrowUp')syncStrength(previous+strengthStep);
    else if(event.key==='PageDown')syncStrength(previous-25);
    else if(event.key==='PageUp')syncStrength(previous+25);
    else if(event.key==='Home')syncStrength(0);
    else if(event.key==='End')syncStrength(250);
    else return;
    event.preventDefault();
    if(previous!==state.strength){
      committedStrength=state.strength;
      if(state.done){invalidate();drawCards();}
      persistProject(false);
    }
  });
  // Unlike an input element, a div slider cannot restore an obsolete 75% form value.
  // Explicit initialization also synchronizes the number shown in the label.
  syncStrength(130);
  window.addEventListener('pageshow',()=>{
    // Do not reset a value the user deliberately changed in this session.
    syncStrength(state.strength);
  });
  function setPreviewView(view){
    state.view=view==='before'?'before':'after';
    $('viewControl').querySelectorAll('button[data-view]').forEach(el=>{
      el.classList.toggle('active',el.dataset.view===state.view);
    });
    $('imageGrid').querySelectorAll('.photo-frame').forEach(el=>el.dataset.view=state.view);
    scheduleProjectMeta();
  }
  $('viewControl').addEventListener('click',event=>{
    const button=event.target.closest('button[data-view]');
    if(button)setPreviewView(button.dataset.view);
  });
  function openPhoto(photo){
    clearPendingRemoval();
    const dialog=$('photoDialog');
    $('detailTitle').textContent='사진 '+String(state.photos.indexOf(photo)+1).padStart(2,'0');
    $('detailOriginal').src=photo.url;
    $('detailEdited').src=photo.resultUrl||photo.url;
    $('detailPhoto').classList.toggle('has-result',Boolean(photo.resultUrl));
    $('detailSliderWrap').hidden=!photo.resultUrl;
    $('detailSave').hidden=!photo.blob;
    $('detailRange').value=photo.compare;
    $('detailPhoto').style.setProperty('--compare',photo.compare+'%');
    dialog.dataset.id=photo.id;
    if(!dialog.open)dialog.showModal();
  }
  function chooseReference(photo){
    if(!photo || photo.id===state.referenceId || collageSaving || zipSaving)return;
    clearPendingRemoval();
    const autoReprocess=state.done || state.working;
    if(state.working){
      // Abort obsolete correction; the newest reference selection wins.
      state.jobToken++;
      state.working=false;
      state.runner?.close();state.runner=null;
    }
    state.referenceId=photo.id;
    invalidate();
    persistProject(false);
    // Update the selected chip synchronously, before the expensive color pass.
    drawCards();
    if(autoReprocess)runCorrection();
    else if(activeScreen==='collage')refreshCollage();
  }
  $('imageGrid').addEventListener('click',e=>{
    const b=e.target.closest('button[data-action]');if(!b)return;
    const photo=state.photos.find(p=>p.id===Number(b.closest('.photo-card')?.dataset.id));if(!photo)return;
    const action=b.dataset.action;
    if(action==='remove'){
      e.preventDefault();
      e.stopPropagation();
      confirmRemovePhoto(photo);
    }else{
      clearPendingRemoval();
      if(action==='open')openPhoto(photo);
      else if(action==='ref')chooseReference(photo);
      else if(action==='download' && photo.blob)saveBlob(photo.blob,resultName(photo,state.photos.indexOf(photo)));
    }
  });
  $('detailRange').addEventListener('input',e=>{
    const photo=state.photos.find(p=>p.id===Number($('photoDialog').dataset.id));
    if(!photo)return;
    photo.compare=Number(e.target.value);
    $('detailPhoto').style.setProperty('--compare',photo.compare+'%');
    scheduleProjectMeta();
  });
  $('detailSave').addEventListener('click',()=>{
    const photo=state.photos.find(p=>p.id===Number($('photoDialog').dataset.id));
    if(photo?.blob)saveBlob(photo.blob,resultName(photo,state.photos.indexOf(photo)));
  });
  $('dialogClose').addEventListener('click',()=>$('photoDialog').close());
  $('photoDialog').addEventListener('click',e=>{if(e.target===$('photoDialog'))$('photoDialog').close();});
  function syncColorSettings(){
    const visible=colorSettingsOpen && activeScreen==='color' && window.innerWidth<=720 && state.photos.length>0;
    $('inlineColorTools').hidden=!visible;
    document.body.classList.toggle('color-settings-open',visible);
    $('colorHeaderSettingsToggle').setAttribute('aria-expanded',String(visible));
    $('colorHeaderSettingsToggle').textContent=visible?'설정 닫기':'설정 열기';
  }
  function setColorSettingsOpen(open){
    colorSettingsOpen=Boolean(open);
    syncColorSettings();
    syncToolsToggle();
    queuePhotoFit();
  }
  function syncToolsToggle(){
    const open=activeScreen==='collage'?document.body.classList.contains('sheet-open'):colorSettingsOpen;
    $('mobileToolsToggle').setAttribute('aria-expanded',String(open));
    $('mobileToolsToggle').setAttribute('aria-controls',activeScreen==='collage'?'collageSection':'inlineColorTools');
    $('mobileToolsLabel').textContent=activeScreen==='collage'
      ?(open?'설정 닫기':UI.collageSettings)
      :(open?'설정 닫기':'설정 열기');
  }
  function closeTools(){
    document.body.classList.remove('sheet-open');
    colorSettingsOpen=false;
    syncColorSettings();
    syncToolsToggle();
    queuePhotoFit();queueCollageFit();
  }
  function openTools(){
    if(!state.photos.length)return;
    if(activeScreen==='color'){
      setColorSettingsOpen(!colorSettingsOpen);
      return;
    }
    if(document.body.classList.contains('sheet-open')){closeTools();return;}
    window.scrollTo({top:0,behavior:'instant'});
    document.body.classList.add('sheet-open');
    syncToolsToggle();
    queueCollageFit();
  }
  $('sheetScrim').addEventListener('click',closeTools);
  document.querySelectorAll('[data-close-sheet]').forEach(b=>b.addEventListener('click',closeTools));
  $('mobileToolsToggle').addEventListener('click',openTools);
  $('colorHeaderSettingsToggle').addEventListener('click',()=>setColorSettingsOpen(!colorSettingsOpen));
  window.matchMedia('(max-width: 720px)').addEventListener('change',e=>{if(!e.matches)closeTools();updateControls();});
  window.addEventListener('resize',()=>{if(state.photos.length)updateControls();queueCollageFit();});
  if(typeof ResizeObserver!=='undefined'){
    const observer=new ResizeObserver(()=>{queuePhotoFit();queueCollageFit();});
    observer.observe($('imageGrid'));
    observer.observe(document.querySelector('.collage-preview-shell'));
  }
  $('mobilePrimary').addEventListener('click',()=>{
    if(activeScreen==='collage'){closeTools();downloadCollage();}
    else runCorrection();  // Keep the color slider's open state and photo geometry unchanged.
  });
  $('mobileZip').addEventListener('click',()=>{if(state.done)downloadAll();});
  function switchScreen(next){
    if(next==='collage' && (!state.photos.length || state.working))return;
    clearPendingRemoval();
    activeScreen=next; closeTools(); updateControls();
    persistProject(false);
    if(next==='collage'){renderCollageOrder();refreshCollage();queueCollageFit();}
    else queuePhotoFit();
  }
  $('tabColor').addEventListener('click',()=>switchScreen('color'));
  $('tabCollage').addEventListener('click',()=>switchScreen('collage'));
  $('headerAdd').addEventListener('click',()=>$('fileInput').click());
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTools();});
  // Flush a trailing debounced settings change when the tab loses focus.
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden' && metaTimer)persistProject(false);
  });
  window.addEventListener('beforeunload',()=>{
    if(metaTimer)persistProject(false);
    for(const p of state.photos){URL.revokeObjectURL(p.url);if(p.resultUrl)URL.revokeObjectURL(p.resultUrl);}
    state.runner?.close();
  });
  updateControls();
  $('pickBtn').disabled=true;
  $('fileInput').disabled=true;
  restoreProject();
})();

</script>
</body></html>
