  .collage-preview-shell {flex:none; min-height:0; height:min(44dvh,355px); padding:4px 18px 16px;}
  .collage-checker canvas {max-width:calc(100vw - 36px); max-height:min(38dvh,315px);}
  body.sheet-open {overflow:hidden;}
  /* Preview is a separate, always-visible pane while settings are expanded. */
  body.sheet-open .stage,
  body.sheet-open .collage-preview-column {
    position:fixed; z-index:32; left:0; right:0; top:106px;
    width:100%; height:var(--mobile-preview-height); min-height:0;
    overflow-y:auto; overscroll-behavior:contain; padding-bottom:0;
  }
  body.sheet-open .stage-toolbar {padding:8px 14px 10px;}
  body.sheet-open .grid {grid-template-columns:repeat(3,minmax(0,1fr)); padding:0 11px 14px; gap:9px;}
  body.sheet-open .photo-frame {aspect-ratio:1/1;}
  body.sheet-open .photo-meta {min-height:0; padding-top:4px;}
  body.sheet-open .photo-name {font-size:9px; padding-top:2px;}
  body.sheet-open .photo-actions {gap:2px;}
  body.sheet-open .ref-btn {font-size:8px; padding:3px;}
  body.sheet-open .stage-footer {display:none;}
  body.sheet-open .collage-preview-head {padding:8px 16px 6px; flex:none;}
  body.sheet-open .collage-preview-shell {height:auto; flex:1; min-height:0; padding:0 12px 9px;}
  body.sheet-open .collage-checker {max-height:100%;}
  body.sheet-open .collage-checker canvas {max-height:calc(var(--mobile-preview-height) - 54px); max-width:calc(100vw - 44px);}
  /* Settings dock below the preview instead of sliding over it. */
  body.sheet-open .studio-layout>.workspace:not([hidden]),
  body.sheet-open .collage-controls:not([hidden]) {
    position:fixed; top:calc(106px + var(--mobile-preview-height));
    right:0; left:0; bottom:var(--mobile-footer-height);
    height:auto; min-height:0; max-height:none;
    z-index:35; visibility:visible; transform:none;
    border:0; border-top:1px solid #dddddd;
    border-radius:0; box-shadow:none;
  }
  body.sheet-open .panel-head {padding:13px 18px 10px;}
  body.sheet-open .panel-head h2 {font-size:15px;}
  body.sheet-open .panel-scroll {padding:0 18px 12px; -webkit-overflow-scrolling:touch;}
  body.sheet-open .setting-block,
  body.sheet-open .collage-section .setting-block {padding:13px 0 15px;}
  body.sheet-open .setting-label,
  body.sheet-open .collage-control-label {margin-bottom:11px;}
  body.sheet-open .workspace-actions {padding:9px 18px 9px;}
  body.sheet-open .workspace-actions .primary-btn {display:none;}
  body.sheet-open .clear-btn {padding:3px 4px;}
  body.sheet-open .sheet-scrim {display:none!important;}
  body.sheet-open .mobile-bar {z-index:38;}
  body.sheet-open .mobile-tools-toggle {background:#ededed;}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="identity"><span class="wordmark" aria-label="tonal">tonal<em>.</em></span></div>
  <nav class="top-tabs" aria-label="Workspace">
    <button id="tabColor" class="top-tab active" type="button" aria-current="page">색감 보정</button>
    <button id="tabCollage" class="top-tab" type="button" disabled>콜라주</button>
  </nav>
  <div class="top-actions"><span id="headerCount" class="header-count" hidden><b id="counter">0</b> / 6</span>
    <button id="headerAdd" class="header-add" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>사진 선택</button>
  </div>
</header>
<main>
  <section class="welcome" id="welcome" aria-label="사진 선택">
    <div id="dropzone" class="upload-zone" tabindex="0" role="button" aria-label="사진 선택">
      <span class="upload-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="17" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 3.5 3.5 3.1-3.1 4.5 4.5"/></svg></span>
      <h1>사진을 여기에 놓아주세요</h1><p>최대 6장  /  JPG, PNG, WebP, AVIF</p>
      <button id="pickBtn" type="button" class="choose-btn">사진 선택</button>
    </div>
  </section>
  <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple hidden>
  <div id="editorView" class="studio-layout" hidden>
    <aside class="workspace" aria-label="색감 보정">
      <div class="panel-head"><h2>색감 보정</h2><button type="button" data-close-sheet class="panel-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div>
      <div class="panel-scroll">
        <section class="setting-block">
          <div class="setting-label">색감 맞춤 방식</div>
          <div class="mode-choices" id="modeControl" role="group" aria-label="색감 맞춤 방식">
            <button type="button" class="mode-choice active" data-mode="auto" aria-pressed="true"><span class="radio-dot" aria-hidden="true"></span>전체 자동 통일</button>
            <button type="button" class="mode-choice" data-mode="reference" aria-pressed="false"><span class="radio-dot" aria-hidden="true"></span>기준 사진에 맞추기</button>
          </div>
        </section>
        <section class="setting-block">
          <label class="setting-label" for="strength"><span>보정 강도</span><span class="range-value" id="strengthLabel">75%</span></label>
          <input class="strength" type="range" id="strength" min="0" max="250" step="5" value="75">
          <div class="strength-scale" aria-hidden="true"><span>0%</span><span>100%</span><span>250%</span></div>
        </section>
        <p id="referenceInfo" class="reference-notice" hidden>기준 사진에 맞추기</p>
      </div>
      <div id="progressBox" class="progress-box" aria-live="polite"><div class="progress-meta"><span id="progressText">이미지를 분석하고 있습니다</span><span id="progressPercent">0%</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
      <div class="workspace-actions"><button type="button" class="primary-btn" id="processBtn" disabled>색감 통일</button><button type="button" class="clear-btn" id="clearBtn" disabled>모두 지우기</button></div>
    </aside>
    <section class="stage" id="results" aria-label="미리보기">
      <div class="stage-toolbar">
        <div class="stage-title"><h2>사진</h2><span class="stage-count" id="resultCount"></span></div>
        <div id="viewControl" class="preview-switch" role="group" aria-label="미리보기"><button class="active" type="button" data-view="after">보정</button><button type="button" data-view="before">원본</button></div>
      </div>
      <div id="imageGrid" class="grid" aria-live="polite"></div>
      <div id="exportBar" class="stage-footer"><span class="stage-footer-text">PNG · JPG</span><button id="downloadAll" type="button" class="primary-btn">전체 ZIP 저장</button></div>
    </section>
  </div>
  <section class="collage-section" id="collageSection" hidden aria-label="콜라주">
    <aside class="collage-controls" aria-label="콜라주">
      <div class="panel-head"><h2>콜라주</h2><button type="button" data-close-sheet class="panel-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div>
      <div class="panel-scroll">
        <section class="setting-block"><div class="collage-control-label">캔버스 방향</div><div class="collage-segmented" id="collageOrientation" role="group" aria-label="캔버스 방향"><button class="segment active" type="button" data-orientation="portrait" aria-pressed="true">세로</button><button class="segment" type="button" data-orientation="landscape" aria-pressed="false">가로</button></div></section>
        <section class="setting-block"><div class="collage-control-label">콜라주 비율</div><div class="collage-ratios" id="collageRatios" role="group" aria-label="콜라주 비율"></div></section>
        <section class="setting-block collage-subcontrols">
          <div><div class="collage-control-label">사진 배치</div><div class="collage-segmented" id="collageLayouts" role="group" aria-label="사진 배치"><button class="segment active" type="button" data-layout="smart" aria-pressed="true">자동</button><button class="segment" type="button" data-layout="regular" aria-pressed="false">그리드</button></div></div>
          <div><div class="collage-control-label">사진 맞춤</div><div class="collage-segmented" id="collageFit" role="group" aria-label="사진 맞춤"><button class="segment active" type="button" data-fit="cover" aria-pressed="true">빈틈 없이</button><button class="segment" type="button" data-fit="contain" aria-pressed="false">전체 보기</button></div></div>
        </section>
        <section class="setting-block collage-subcontrols">
          <div><label class="setting-label" for="collageGap"><span>사진 간격</span><span id="collageGapValue" class="range-value">0px</span></label><input class="collage-slider" type="range" id="collageGap" min="0" max="120" step="4" value="0"></div>
          <div><label class="setting-label" for="collagePadding"><span>바깥 여백</span><span id="collagePaddingValue" class="range-value">0px</span></label><input class="collage-slider" type="range" id="collagePadding" min="0" max="240" step="8" value="0"></div>
        </section>
        <section class="setting-block"><div class="collage-control-label">배경색</div><div class="collage-color-row" id="collageBackground" role="group" aria-label="배경색">
          <button type="button" class="collage-color active" data-bg="white" aria-pressed="true"><span class="collage-swatch swatch-white"></span>화이트</button>
          <button type="button" class="collage-color" data-bg="soft" aria-pressed="false"><span class="collage-swatch swatch-soft"></span>아이보리</button>
          <button type="button" class="collage-color" data-bg="black" aria-pressed="false"><span class="collage-swatch swatch-black"></span>블랙</button>
          <button type="button" class="collage-color" data-bg="transparent" aria-pressed="false"><span class="collage-swatch swatch-transparent"></span>투명</button>
        </div></section>
        <section class="setting-block"><label class="collage-control-label" for="collageResolution">저장 화질</label><select class="collage-select" id="collageResolution"><option value="2400">표준 · 긴 변 2400px</option><option value="3200" selected>고화질 · 긴 변 3200px</option><option value="4000">초고화질 · 긴 변 4000px</option></select></section>
      </div>
    </aside>
    <div class="collage-preview-column">
      <div class="collage-preview-head"><strong>미리보기</strong><span id="collageOutputSize">2400 × 3200px</span></div>
      <div class="collage-preview-shell"><div class="collage-checker"><canvas id="collageCanvas" width="600" height="800" aria-label="미리보기"></canvas></div></div>
      <p class="collage-preview-help" id="collagePreviewHelp" role="status" hidden></p>
      <button type="button" class="primary-btn collage-save" id="saveCollage">콜라주 PNG 저장</button>
    </div>
  </section>
</main>
<div id="status" class="status" role="status" aria-live="polite"></div>

<div id="mobileBar" class="mobile-bar" hidden>
  <button type="button" id="mobileToolsToggle" class="mobile-tools-toggle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M8 12h12M4 18h16"/><circle cx="6" cy="12" r="2" fill="currentColor" stroke="none"/></svg><span id="mobileToolsLabel">보정 설정</span></button>
  <button type="button" id="mobilePrimary" class="primary-btn mobile-primary">색감 통일</button>
</div>
<div id="sheetScrim" class="sheet-scrim" aria-hidden="true"></div>
<dialog id="photoDialog" class="photo-dialog" aria-label="미리보기">
  <div class="dialog-head"><span class="dialog-title" id="detailTitle"></span><button type="button" id="dialogClose" class="dialog-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg></button></div>
  <div class="dialog-stage"><div class="dialog-photo" id="detailPhoto"><img id="detailOriginal" alt="원본"><img id="detailEdited" class="detail-edited" alt="보정"><div class="dialog-line" aria-hidden="true"></div></div></div>
  <div class="dialog-controls"><div class="detail-slider-wrap" id="detailSliderWrap"><span>원본</span><input id="detailRange" type="range" min="0" max="100" value="50" aria-label="미리보기"><span>보정</span></div><button type="button" class="detail-download" id="detailSave" hidden>저장</button></div>
</dialog>
<script>
'use strict';
(() => {
  const MAX_FILES = 6;
  const $ = (id) => document.getElementById(id);
  const state = { photos: [], mode: 'auto', referenceId: null, strength: 75, view: 'after', working: false, done: false, jobToken: 0, runner: null };
  let activeScreen='color';
  const UI = {"process":"\uc0c9\uac10 \ud1b5\uc77c","clear":"\ubaa8\ub450 \uc9c0\uc6b0\uae30","retry":"\ub2e4\uc2dc \ubcf4\uc815","cancel":"\ucde8\uc18c","photoAdd":"\uc0ac\uc9c4 \uc120\ud0dd","editSettings":"\ubcf4\uc815 \uc124\uc815","collageSettings":"\ucf5c\ub77c\uc8fc \uc124\uc815","collageSave":"\u2193 \ucf5c\ub77c\uc8fc PNG \uc800\uc7a5","ref":"\uae30\uc900 \uc0ac\uc9c4\uc5d0 \ub9de\ucd94\uae30","save":"\uc800\uc7a5"};
  const collage = {orientation:'portrait', ratio:'3:4', layout:'smart', fit:'cover', gap:0, padding:0, background:'white', resolution:3200};
  let collageRevision=0;
  let collageSaving=false;
  const icons = {
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6 18 18M18 6 6 18"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/></svg>'
  };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const safe = (value) => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const sleep = () => new Promise(resolve => setTimeout(resolve,0));
  let idSequence = 0;

  function flash(message, isError = false) {
    const el = $('status'); el.textContent = message;
    el.classList.add('visible'); el.classList.toggle('error', isError);
  }
  function clearFlash() { $('status').classList.remove('visible', 'error'); }
  function progress(value, description) {
    value = clamp(value, 0, 100);
    $('progressBox').classList.add('visible');
    $('progressFill').style.width = `${value}%`;
    $('progressPercent').textContent = `${Math.round(value)}%`;
    $('progressText').textContent = description;
  }
  function resetProgress() { $('progressBox').classList.remove('visible'); }
  function updateControls() {
    const total=state.photos.length;
    if(!total && activeScreen==='collage')activeScreen='color';
    document.body.classList.toggle('has-photos',total>0);
    document.body.classList.toggle('is-full',total>=MAX_FILES);
    document.body.classList.toggle('has-results',state.done);
    $('welcome').hidden=total>0;
    $('editorView').hidden=!total || activeScreen!=='color';
    $('collageSection').hidden=!total || activeScreen!=='collage';
    $('mobileBar').hidden=!total;
    $('headerCount').hidden=!total;
    $('counter').textContent=total;
    $('headerAdd').hidden=!total || total>=MAX_FILES;
    $('headerAdd').disabled=state.working || collageSaving;
    $('fileInput').disabled=state.working || collageSaving;
    $('clearBtn').disabled=!total || state.working || collageSaving;
    $('processBtn').disabled=!total;
    $('processBtn').textContent=state.working?UI.cancel:state.done?UI.retry:UI.process;
    $('modeControl').querySelectorAll('button').forEach(b=>b.disabled=state.working);
    $('strength').disabled=state.working;
    $('resultCount').textContent=total ? `${total} / ${MAX_FILES}` : '';
    $('referenceInfo').hidden=true;
    $('viewControl').classList.toggle('visible',state.done && state.photos.some(p=>Boolean(p.resultUrl)));
    $('exportBar').classList.toggle('visible',state.done && total>0);
    $('saveCollage').disabled=!total || state.working || collageSaving;
    $('tabCollage').disabled=!total || state.working;
    $('tabColor').classList.toggle('active',activeScreen==='color');
    $('tabCollage').classList.toggle('active',activeScreen==='collage');
    $('tabColor').setAttribute('aria-current',activeScreen==='color'?'page':'false');
    $('tabCollage').setAttribute('aria-current',activeScreen==='collage'?'page':'false');
    syncToolsToggle();
    $('mobilePrimary').textContent=activeScreen==='collage'?UI.collageSave:state.working?UI.cancel:state.done?UI.retry:UI.process;
    $('mobilePrimary').disabled=activeScreen==='collage'?(!total || state.working || collageSaving):!total;
  }
  function invalidate() {
    if($('photoDialog').open)$('photoDialog').close();
    collageRevision++;
    state.done = false;
    for (const p of state.photos) {
      if (p.resultUrl) URL.revokeObjectURL(p.resultUrl);
      p.resultUrl = null; p.blob = null; p.profile = null; p.compare = 50; p.collageThumb = null; p.collageSource = null; p.collageSize = null;
    }
    resetProgress(); clearFlash();
  }
  function drawCards() {
    if(!state.photos.length){$('imageGrid').innerHTML=''; updateControls(); return;}
    $('imageGrid').innerHTML=state.photos.map((p,i)=>{
      const result=Boolean(p.resultUrl);
      const refMode=state.mode==='reference' && state.photos.length>1;
      const refSelected=p.id===state.referenceId;
      return `<article class="photo-card" data-id="${p.id}">
        <div class="photo-frame ${result?'compare-ready':''}" data-view="${state.view}">
          <button type="button" class="photo-open" data-action="open" aria-label="${safe(p.file.name)}"><img class="original-image" src="${p.url}" alt="${safe(p.file.name)}">
            ${result?`<img class="edited-image" src="${p.resultUrl}" alt="">`:''}</button>
          <span class="image-ordinal">${String(i+1).padStart(2,'0')}</span>
          <button type="button" class="remove-photo" title="${UI.clear}" aria-label="${safe(p.file.name)}" data-action="remove" ${state.working||collageSaving?'disabled':''}>${icons.close}</button>
        </div>
        <div class="photo-meta"><span class="photo-name" title="${safe(p.file.name)}">${safe(p.file.name)}</span><div class="photo-actions">
          ${refMode?`<button type="button" class="ref-btn ${refSelected?'selected':''}" data-action="ref" ${state.working||collageSaving?'disabled':''}>${refSelected?UI.ref.split(' ')[0]:UI.ref.split(' ')[0]+' '+UI.editSettings.split(' ')[1]}</button>`:''}
          ${result?`<button type="button" class="download-single" data-action="download" aria-label="${safe(p.file.name)} ${UI.save}" title="${UI.save}">${icons.download}</button>`:''}
        </div></div></article>`;
    }).join('');
    updateControls();
  }
  async function uploadFiles(files) {
    if (state.working || collageSaving) return;
    const candidates = Array.from(files).filter(f => f.type.startsWith('image/') && /^(image\/(jpeg|png|webp|avif))$/.test(f.type));
    if (!candidates.length) { flash('지원되는 이미지(JPEG, PNG, WebP, AVIF)를 선택해주세요.', true); return; }
    const remaining = MAX_FILES - state.photos.length;
    if (remaining <= 0) { flash('최대 6장까지 추가할 수 있습니다.', true); return; }
    if (candidates.some(f => f.size > 60 * 1024 * 1024)) {
      flash('60MB를 초과하는 이미지가 있어 제외했습니다. 파일 크기를 줄여 다시 시도해주세요.', true);
    }
    const accepted = candidates.filter(f => f.size <= 60*1024*1024).slice(0, remaining);
    if (!accepted.length) return;
    invalidate();
    for (const file of accepted) {
      const item = { id:++idSequence, file, url:URL.createObjectURL(file), resultUrl:null, blob:null, profile:null, compare:50, collageThumb:null };
      state.photos.push(item);
      if (state.referenceId === null) state.referenceId = item.id;
    }
    drawCards();
    if(activeScreen==='collage')refreshCollage();
    if (candidates.length > remaining) flash(`6장 제한으로 ${remaining}장만 추가했습니다.`, true);
    else if (candidates.every(f => f.size <= 60*1024*1024)) clearFlash();
  }
  function removePhoto(id) {
    if (state.working || collageSaving) return;
    const at = state.photos.findIndex(p => p.id === id);
    if (at === -1) return;
    invalidate();
    const [photo] = state.photos.splice(at,1);
    URL.revokeObjectURL(photo.url);
    if (state.referenceId === id) state.referenceId = state.photos[0]?.id ?? null;
    drawCards();
    if(activeScreen==='collage')refreshCollage();
  }
  function removeAll() {
    if (state.working || collageSaving) return;
    invalidate();
    for (const p of state.photos) URL.revokeObjectURL(p.url);
    state.photos = []; state.referenceId = null;
    drawCards();
  }

  async function decode(file, sourceUrl) {
    if (typeof createImageBitmap === 'function') {
      try {
        const bmp = await createImageBitmap(file);
        return { image:bmp, width:bmp.width, height:bmp.height, close:() => bmp.close() };
      } catch (_) { /* fallback to an HTML image element */ }
    }
    const element = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('이미지 디코딩에 실패했습니다. 지원하지 않는 형식일 수 있습니다.'));
      img.src = sourceUrl;
    });
    return { image:element, width:element.naturalWidth, height:element.naturalHeight, close:()=>{ element.src=''; } };
  }
  // OKLab is perceptually more uniform than RGB, so correction is applied to
  // brightness and chromatic axes separately. All statistics stay local.
  function srgbLinear(v) { v/=255; return v<=.04045 ? v/12.92 : ((v+.055)/1.055)**2.4; }
  const linearInput = Float32Array.from({length:256}, (_,i) => srgbLinear(i));
  function labFromRGB(r8, g8, b8) {

      const items=state.photos.map((p,i)=>({blob:p.blob,name:resultName(p,i)}));
      const zip=await makeZip(items);
      saveBlob(zip,`tonal_색감통일_${items.length}장.zip`);
    }catch(err){flash(`ZIP 저장 중 오류가 발생했습니다: ${err.message}`,true);}
    finally {button.textContent=label;button.disabled=false;}
  }


  // Collage uses the original image until color correction has completed.
  // Completed corrections use their full-resolution edited blobs instead.
  // Preview and saved PNG share the same tile geometry.
  const collageBackgrounds={white:'#ffffff',soft:'#f5f3ef',black:'#1a1b20',transparent:null};
  const collageRatioOptions=['3:4','2:3','4:5','9:16','1:1'];
  function actualRatio() {
    const [a,b]=collage.ratio.split(':').map(Number);
    return collage.orientation==='landscape' ? [b,a] : [a,b];
  }
  function collageDimensions() {
    const [a,b]=actualRatio(),long=collage.resolution;
    return a>b ? {width:long,height:Math.round(long*b/a)} : {width:Math.round(long*a/b),height:long};
  }
  function updateCollageRatios() {
    const selected=collage.ratio;
    $('collageRatios').innerHTML=collageRatioOptions.map(key=>{
      const [a,b]=key.split(':'),ratio=collage.orientation==='landscape'?`${b}:${a}`:key;
      const [w,h]=ratio.split(':').map(Number);
      return `<button type="button" class="ratio-btn ${key===selected?'selected':''}" data-ratio="${key}" aria-pressed="${key===selected}"><span class="ratio-icon" aria-hidden="true" style="--aspect:${w/h}"></span><span>${ratio}</span></button>`;
    }).join('');
  }
  function updateCollageSize() {
    const {width,height}=collageDimensions();
    $('collageOutputSize').textContent=`${width.toLocaleString('ko-KR')} × ${height.toLocaleString('ko-KR')}px`;
  }
  function collageTileDimensions(photos) {
    return photos.map(p=>{
      if(!p.collageSize)throw new Error('사진 크기를 확인하지 못했습니다.');
      return p.collageSize;
    });
  }
  function rowPartitions(n, maxPerRow=3, maxRows=4) {
    const patterns=[];
    function walk(rest,parts){
      if(!rest){patterns.push(parts);return;}
      if(parts.length===maxRows)return;
      for(let v=1;v<=Math.min(maxPerRow,rest);v++)walk(rest-v,[...parts,v]);
    }
    walk(n,[]);return patterns;
  }
  function regularCollageRows(n,wide) {
    if(n===1)return [1];
    if(n===2)return wide?[2]:[1,1];
    if(n===3)return wide?[2,1]:[1,2];
    if(n===4)return [2,2];
    if(n===5)return wide?[3,2]:[2,1,2];
    return wide?[3,3]:[2,2,2];
  }
  function layoutForRows(pattern,images,W,H,gap,margin,smart) {
    const contentWidth=W-margin*2,contentHeight=H-margin*2;
    const rowCount=pattern.length;
    const usableH=contentHeight-gap*(rowCount-1);
    if(usableH<=0 || contentWidth<=0)return null;
    const natural=[],ratios=images.map(img=>img.width/img.height);
    let start=0;
    for(const amount of pattern){
      const usableW=contentWidth-gap*(amount-1);
      if(usableW<=0)return null;
      const weights=ratios.slice(start,start+amount).map(a=>smart?clamp(a,.48,2.05):1);
      const sum=weights.reduce((a,b)=>a+b,0);
      natural.push({amount,weights,sum,width:usableW,baseHeight:usableW/(smart?sum:amount)});
      start+=amount;
    }
    const heightTotal=natural.reduce((t,row)=>t+row.baseHeight,0);
    const tiles=[];
    let y=margin,offset=0;
    for(const row of natural){
      const rowH=smart?row.baseHeight/heightTotal*usableH:usableH/rowCount;
      let x=margin;
      for(let col=0;col<row.amount;col++){
        const width=row.width*row.weights[col]/row.sum;
        tiles.push({x,y,w:width,h:rowH});
        x+=width+gap;
      }
      y+=rowH+gap;offset+=row.amount;
    }
    let loss=0,small=0;
    for(let i=0;i<tiles.length;i++){
      const cell=tiles[i],targetAspect=cell.w/cell.h,sourceAspect=ratios[i];
      loss+=1-Math.min(targetAspect/sourceAspect,sourceAspect/targetAspect);
      const frac=cell.w*cell.h/(contentWidth*contentHeight);
      small+=Math.max(0,.105-frac);
    }
    return {tiles,score:loss/images.length+small*.35+Math.abs(rowCount-(W>=H?2:3))*.009};
  }
  function calculateCollageLayout(images,W,H,settings) {
    const margin=clamp(settings.padding,0,Math.min(W,H)*.22);
    const gap=clamp(settings.gap,0,Math.min(W,H)*.12);
    if(settings.layout==='regular')return layoutForRows(regularCollageRows(images.length,W>=H),images,W,H,gap,margin,false).tiles;
    let best=null;
    for(const pattern of rowPartitions(images.length)){
      const layout=layoutForRows(pattern,images,W,H,gap,margin,true);
      if(layout && (!best || layout.score<best.score))best=layout;
    }
    if(!best)throw new Error('콜라주 레이아웃을 계산할 수 없습니다.');
    return best.tiles;
  }
  function paintCollageBackground(ctx,width,height) {
    ctx.clearRect(0,0,width,height);
    const color=collageBackgrounds[collage.background];
    if(color){ctx.fillStyle=color;ctx.fillRect(0,0,width,height);}
  }
  function paintCollageTile(ctx,image,cell,scale) {
    const x=Math.round(cell.x*scale),y=Math.round(cell.y*scale);
    const endX=Math.round((cell.x+cell.w)*scale),endY=Math.round((cell.y+cell.h)*scale);
    const w=Math.max(1,endX-x),h=Math.max(1,endY-y);
    const iw=image.width||image.naturalWidth, ih=image.height||image.naturalHeight;
    if(!iw||!ih)return;
    if(collage.fit==='contain'){
      const factor=Math.min(w/iw,h/ih),dw=iw*factor,dh=ih*factor;
      ctx.drawImage(image,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
    }else{
      const cropRatio=Math.min(iw/w,ih/h);
      const sw=Math.min(iw,w*cropRatio),sh=Math.min(ih,h*cropRatio);
      ctx.drawImage(image,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h);
    }
  }
  // Store thumbnail and original dimensions for whichever version is shown.
  async function smallCollageImage(photo){
    const source=state.done && photo.blob ? photo.blob : photo.file;
    const sourceUrl=state.done && photo.resultUrl ? photo.resultUrl : photo.url;
    if(photo.collageThumb && photo.collageSource===source)return photo.collageThumb;
    const decoded=await decode(source,sourceUrl);
    try {
      const scale=Math.min(1,1100/Math.max(decoded.width,decoded.height));
      const w=Math.max(1,Math.round(decoded.width*scale)),h=Math.max(1,Math.round(decoded.height*scale));
      const thumb=document.createElement('canvas');thumb.width=w;thumb.height=h;
      const ctx=thumb.getContext('2d',{alpha:true,colorSpace:'srgb'});
      if(!ctx)throw new Error('콜라주 미리보기를 만들 수 없습니다.');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      ctx.drawImage(decoded.image,0,0,w,h);
      if(state.photos.includes(photo) && (state.done && photo.blob ? photo.blob : photo.file)===source){
        photo.collageThumb=thumb;
        photo.collageSource=source;
        photo.collageSize={width:decoded.width,height:decoded.height};
      }
      return thumb;
    } finally {decoded.close();}
  }
  async function refreshCollage() {
    const revision=++collageRevision;
    if(!state.photos.length || state.working || activeScreen!=='collage')return;
    const photos=state.photos.slice();
    updateCollageSize();
    $('collagePreviewHelp').hidden=false;
    $('collagePreviewHelp').textContent='미리보기 생성 중…';
    try {
      const {width,height}=collageDimensions();
      const maxPreview=1000,scale=Math.min(1,maxPreview/Math.max(width,height));
      const preview=$('collageCanvas');
      const px=Math.max(1,Math.round(width*scale)),py=Math.max(1,Math.round(height*scale));
      const images=[];
      for(const photo of photos){
        if(revision!==collageRevision)return;
        images.push(await smallCollageImage(photo));
      }
      if(revision!==collageRevision || state.working || activeScreen!=='collage')return;
      const tiles=calculateCollageLayout(collageTileDimensions(photos),width,height,collage);
      preview.width=px;preview.height=py;
      const ctx=preview.getContext('2d',{alpha:true,colorSpace:'srgb'});
      if(!ctx)throw new Error('콜라주 미리보기를 만들 수 없습니다.');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      paintCollageBackground(ctx,px,py);
      tiles.forEach((tile,i)=>paintCollageTile(ctx,images[i],tile,px/width));
      $('collagePreviewHelp').textContent='';
      $('collagePreviewHelp').hidden=true;
    }catch(err){
      if(revision===collageRevision){
        $('collagePreviewHelp').textContent='미리보기를 생성하지 못했습니다.';
        flash(`콜라주 미리보기 오류: ${err.message}`,true);
      }
    }
  }
  async function downloadCollage(){
    if(state.working || collageSaving || !state.photos.length)return;
    const token=state.jobToken,revision=collageRevision;
    const photos=state.photos.slice();
    const useEdited=state.done && photos.every(p=>Boolean(p.blob));
    const button=$('saveCollage');
    collageSaving=true;button.disabled=true;button.textContent='콜라주 저장 준비 중…';
    updateControls();
    let canvas=null;
    try {
      const {width,height}=collageDimensions();
      // Prepare original-image dimensions before any color correction has run.
      for(const photo of photos)await smallCollageImage(photo);
      if(revision!==collageRevision || token!==state.jobToken)throw new Error('사진이 변경되어 저장을 중단했습니다.');
      const tiles=calculateCollageLayout(collageTileDimensions(photos),width,height,collage);
      canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
      const ctx=canvas.getContext('2d',{alpha:true,colorSpace:'srgb'});
      if(!ctx)throw new Error('콜라주 출력용 캔버스를 만들 수 없습니다.');
      ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
      paintCollageBackground(ctx,width,height);
      for(let i=0;i<photos.length;i++){
        if(revision!==collageRevision || token!==state.jobToken)throw new Error('사진이 변경되어 저장을 중단했습니다.');
        button.textContent=`고화질 이미지 합성 중… ${i+1}/${photos.length}`;
        const source=useEdited?photos[i].blob:photos[i].file;
        const decoded=await decode(source,useEdited?photos[i].resultUrl:photos[i].url);
        try{paintCollageTile(ctx,decoded.image,tiles[i],1);}
        finally{decoded.close();}
        await sleep();
      }
      if(revision!==collageRevision || token!==state.jobToken)throw new Error('사진이 변경되어 저장을 중단했습니다.');
      button.textContent='PNG 생성 중…';
      const blob=await encodeCanvas(canvas,'image/png');
      const [a,b]=actualRatio();
      saveBlob(blob,`tonal_collage_${useEdited?'보정':'원본'}_${photos.length}장_${a}x${b}_${width}x${height}.png`);
    }catch(err){flash(`콜라주 저장 중 오류: ${err.message}`,true);}
    finally{
      if(canvas){canvas.width=0;canvas.height=0;}
      collageSaving=false;button.disabled=false;button.textContent='콜라주 PNG 저장';
      updateControls();
    }
  }
  function updateSegment(container,button){
    container.querySelectorAll('button').forEach(el=>{
      const active=el===button;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));
    });
  }
  function bindCollageSegment(id,selector,field){
    $(id).addEventListener('click',e=>{
      const button=e.target.closest(selector);if(!button || state.working || collageSaving)return;
      const next=button.dataset[field];if(!next || collage[field]===next)return;
      collage[field]=next;updateSegment($(id),button);
      if(field==='orientation')updateCollageRatios();
      refreshCollage();
    });
  }
  bindCollageSegment('collageOrientation','button[data-orientation]','orientation');
  bindCollageSegment('collageLayouts','button[data-layout]','layout');
  bindCollageSegment('collageFit','button[data-fit]','fit');
  $('collageRatios').addEventListener('click',e=>{
    const button=e.target.closest('button[data-ratio]');
    if(!button || state.working || collageSaving)return;
    collage.ratio=button.dataset.ratio;updateCollageRatios();refreshCollage();
  });
  for(const [name,label] of [['Gap','gap'],['Padding','padding']]){
    $('collage'+name).addEventListener('input',e=>{
      if(state.working || collageSaving)return;
      collage[label]=Number(e.target.value);
      $('collage'+name+'Value').textContent=collage[label]+'px';
      refreshCollage();
    });
  }
  $('collageBackground').addEventListener('click',e=>{
    const button=e.target.closest('button[data-bg]');if(!button||state.working||collageSaving)return;
    collage.background=button.dataset.bg;
    $('collageBackground').querySelectorAll('button').forEach(el=>{
      const active=el===button;el.classList.toggle('active',active);el.setAttribute('aria-pressed',String(active));
    });
    refreshCollage();
  });
  $('collageResolution').addEventListener('change',e=>{
    if(state.working || collageSaving)return;
    collage.resolution=Number(e.target.value);
    refreshCollage();
  });
  $('saveCollage').addEventListener('click',downloadCollage);
  updateCollageRatios();
  updateCollageSize();

  $('pickBtn').addEventListener('click',e=>{e.stopPropagation();$('fileInput').click();});
  $('dropzone').addEventListener('click',()=>{if(!state.working && state.photos.length<MAX_FILES)$('fileInput').click();});
  $('dropzone').addEventListener('keydown',e=>{if(e.target!==$('dropzone'))return;if(e.key==='Enter'||e.key===' '){e.preventDefault();$('dropzone').click();}});
  $('fileInput').addEventListener('change',async e=>{await uploadFiles(e.target.files);e.target.value='';});
  let dragLevel=0;
  document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();});
  document.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length && !e.target.closest('#dropzone'))e.preventDefault();});
  $('dropzone').addEventListener('dragenter',e=>{e.preventDefault();dragLevel++;$('dropzone').classList.add('dragging');});
  $('dropzone').addEventListener('dragover',e=>e.preventDefault());
  $('dropzone').addEventListener('dragleave',e=>{e.preventDefault();dragLevel=Math.max(0,dragLevel-1);if(!dragLevel)$('dropzone').classList.remove('dragging');});
  $('dropzone').addEventListener('drop',async e=>{e.preventDefault();dragLevel=0;$('dropzone').classList.remove('dragging');await uploadFiles(e.dataTransfer.files);});
  document.addEventListener('drop',async e=>{if(e.target.closest('#dropzone'))return;if(e.dataTransfer?.files?.length && state.photos.length<MAX_FILES)await uploadFiles(e.dataTransfer.files);});
  $('clearBtn').addEventListener('click',removeAll);
  $('processBtn').addEventListener('click',runCorrection);
  $('downloadAll').addEventListener('click',downloadAll);
  $('modeControl').addEventListener('click',e=>{
    const b=e.target.closest('button[data-mode]');if(!b || state.working)return;
    const mode=b.dataset.mode;if(mode===state.mode)return;
    state.mode=mode;
    $('modeControl').querySelectorAll('button').forEach(el=>{const on=el===b;el.classList.toggle('active',on);el.setAttribute('aria-pressed',String(on));});
    invalidate();drawCards();
  });
  $('strength').addEventListener('input',e=>{
    const value=Number(e.target.value);
    $('strengthLabel').textContent=value+'%';
  });
  $('strength').addEventListener('change',e=>{state.strength=Number(e.target.value);invalidate();drawCards();});
  $('viewControl').addEventListener('click',e=>{
    const b=e.target.closest('button[data-view]');if(!b)return;
    state.view=b.dataset.view;
    $('viewControl').querySelectorAll('button').forEach(el=>el.classList.toggle('active',el===b));
    $('imageGrid').querySelectorAll('.photo-frame').forEach(el=>el.dataset.view=state.view);
  });
  function openPhoto(photo){
    const dialog=$('photoDialog');
    $('detailTitle').textContent=photo.file.name;
    $('detailOriginal').src=photo.url;
    $('detailEdited').src=photo.resultUrl||photo.url;
    $('detailPhoto').classList.toggle('has-result',Boolean(photo.resultUrl));
    $('detailSliderWrap').hidden=!photo.resultUrl;
    $('detailSave').hidden=!photo.blob;
    $('detailRange').value=photo.compare;
    $('detailPhoto').style.setProperty('--compare',photo.compare+'%');
    dialog.dataset.id=photo.id;
    if(!dialog.open)dialog.showModal();
  }
  $('imageGrid').addEventListener('click',e=>{
    const b=e.target.closest('button[data-action]');if(!b)return;
    const photo=state.photos.find(p=>p.id===Number(b.closest('.photo-card')?.dataset.id));if(!photo)return;
    const action=b.dataset.action;
    if(action==='open')openPhoto(photo);
    else if(action==='remove')removePhoto(photo.id);
    else if(action==='ref'){state.referenceId=photo.id;invalidate();drawCards();}
    else if(action==='download' && photo.blob)saveBlob(photo.blob,resultName(photo,state.photos.indexOf(photo)));
  });
  $('detailRange').addEventListener('input',e=>{
    const photo=state.photos.find(p=>p.id===Number($('photoDialog').dataset.id));
    if(!photo)return;
    photo.compare=Number(e.target.value);
    $('detailPhoto').style.setProperty('--compare',photo.compare+'%');
  });
  $('detailSave').addEventListener('click',()=>{
    const photo=state.photos.find(p=>p.id===Number($('photoDialog').dataset.id));
    if(photo?.blob)saveBlob(photo.blob,resultName(photo,state.photos.indexOf(photo)));
  });
  $('dialogClose').addEventListener('click',()=>$('photoDialog').close());
  $('photoDialog').addEventListener('click',e=>{if(e.target===$('photoDialog'))$('photoDialog').close();});
  function syncToolsToggle(){
    const open=document.body.classList.contains('sheet-open');
    $('mobileToolsToggle').setAttribute('aria-expanded',String(open));
    $('mobileToolsToggle').setAttribute('aria-controls',activeScreen==='collage'?'collageSection':'editorView');
    $('mobileToolsLabel').textContent=open?'설정 닫기':activeScreen==='collage'?UI.collageSettings:UI.editSettings;
  }
  function closeTools(){document.body.classList.remove('sheet-open');syncToolsToggle();}
  function openTools(){
    if(!state.photos.length)return;
    if(document.body.classList.contains('sheet-open')){closeTools();return;}
    window.scrollTo({top:0,behavior:'instant'});
    document.body.classList.add('sheet-open');
    syncToolsToggle();
  }
  $('sheetScrim').addEventListener('click',closeTools);
  document.querySelectorAll('[data-close-sheet]').forEach(b=>b.addEventListener('click',closeTools));
  $('mobileToolsToggle').addEventListener('click',openTools);
  window.matchMedia('(max-width: 720px)').addEventListener('change',e=>{if(!e.matches)closeTools();});
  $('mobilePrimary').addEventListener('click',()=>{
    closeTools();
    if(activeScreen==='collage')downloadCollage();else runCorrection();
  });
  function switchScreen(next){
    if(next==='collage' && (!state.photos.length || state.working))return;
    activeScreen=next; closeTools(); updateControls();
    if(next==='collage')refreshCollage();
  }
  $('tabColor').addEventListener('click',()=>switchScreen('color'));
  $('tabCollage').addEventListener('click',()=>switchScreen('collage'));
  $('headerAdd').addEventListener('click',()=>$('fileInput').click());
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTools();});
  window.addEventListener('beforeunload',()=>{
    for(const p of state.photos){URL.revokeObjectURL(p.url);if(p.resultUrl)URL.revokeObjectURL(p.resultUrl);}
    state.runner?.close();
  });
  updateControls();
})();

</script>
</body></html>
